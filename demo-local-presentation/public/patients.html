<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>患者列表 — 社区慢病管理演示</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-logo">医</div>
          <div>
            <h1>患者列表</h1>
            <p class="sub" id="who">—</p>
          </div>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <a class="btn btn-ghost" href="index.html">首页</a>
          <a class="btn btn-ghost" href="overview.html">项目简报</a>
          <button type="button" class="btn btn-ghost" id="btnOut">退出</button>
        </div>
      </header>

      <div class="card">
        <p class="muted" style="margin: 0 0 16px; font-size: 0.9rem">点击行进入档案与近期血压、血糖数据。</p>
        <div class="data-table-wrap">
          <table>
            <thead>
              <tr>
                <th>姓名</th>
                <th>年龄</th>
                <th>慢病标签</th>
                <th>最近随访</th>
              </tr>
            </thead>
            <tbody id="tb"></tbody>
          </table>
        </div>
      </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script>
      (async function () {
      if (!DemoApi.requireAuth()) return;

      const u = sessionStorage.getItem('demo_user');
      if (u) {
        try {
          const j = JSON.parse(u);
          document.getElementById('who').textContent = '当前：' + j.name + '（' + j.role + '）';
        } catch (_) {}
      }

      document.getElementById('btnOut').addEventListener('click', function () {
        DemoApi.logout();
      });

      try {
        const data = await DemoApi.fetch('/api/patients');
        const tb = document.getElementById('tb');
        tb.innerHTML = data.list
          .map(function (p) {
            const tags = (p.tags || [])
              .map(function (t) {
                return '<span class="badge">' + t + '</span>';
              })
              .join('');
            return (
              '<tr style="cursor:pointer" data-href="detail.html?id=' +
              p.id +
              '">' +
              '<td><strong>' +
              p.name +
              '</strong></td>' +
              '<td>' +
              p.age +
              '</td>' +
              '<td>' +
              tags +
              '</td>' +
              '<td>' +
              p.lastVisit +
              '</td>' +
              '</tr>'
            );
          })
          .join('');

        tb.querySelectorAll('tr').forEach(function (tr) {
          tr.addEventListener('click', function () {
            location.href = tr.getAttribute('data-href');
          });
        });
      } catch (e) {
        document.getElementById('tb').innerHTML =
          '<tr><td colspan="4" class="empty">' + (e.message || '加载失败') + '</td></tr>';
      }
      })();
    </script>
  </body>
</html>
